plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.goldclient.client'
    compileSdk 34
    ndkVersion '26.1.10909125'
    defaultConfig {
        applicationId "com.goldclient.client"
        minSdk 24
        targetSdk 29   // acceso clasico a almacenamiento; sin restricciones de carga de codigo de Android 14
        versionCode 23
        versionName "1.0-host23"
        // El juego (libemu32) solo existe en arm64-v8a, asi que el launcher tambien.
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    // Firma fija: asi cada build nuevo se instala ENCIMA del anterior (antes la clave cambiaba en cada build de GitHub)
    signingConfigs {
        debug {
            storeFile file('gold-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packagingOptions { jniLibs { useLegacyPackaging = true } }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
